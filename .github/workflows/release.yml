name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do with the built installer
        type: choice
        default: draft release
        options:
          - draft release
          - build only
      bump:
        description: Version bump, committed to master once the build passed (ignored for build only)
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
      head: ${{ steps.version.outputs.head }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          lfs: true

      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $bump = if ("${{ inputs.mode }}" -eq "build only") { "none" } else { "${{ inputs.bump }}" }
          $version = ./.github/scripts/bump-version.ps1 -Bump $bump
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Add-Content $env:GITHUB_OUTPUT "bump=$bump"
          Add-Content $env:GITHUB_OUTPUT "head=$(git rev-parse HEAD)"

      - name: Check that the version is not released yet
        if: inputs.mode != 'build only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isDraft = gh release view "${{ steps.version.outputs.version }}" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $isDraft -eq "false") {
            throw "Release ${{ steps.version.outputs.version }} is already published. Pick a bump other than none."
          }
          exit 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:auto-update

      - name: Upload unsigned payload
        uses: actions/upload-artifact@v7
        with:
          name: kute-unsigned-payload-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            target/release/kute.exe
            target/release/kute.pdb
            target/release/dist
          retention-days: 1
          if-no-files-found: error

  release:
    name: Sign and package
    needs: build
    runs-on: [self-hosted, windows, kute-signing]
    timeout-minutes: 120
    outputs:
      version: ${{ needs.build.outputs.version }}
      commit: ${{ steps.commit.outputs.oid }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.head }}
          fetch-depth: 0

      - name: Bump version
        shell: pwsh
        run: |
          $version = ./.github/scripts/bump-version.ps1 -Bump "${{ needs.build.outputs.bump }}"
          if ($version -ne "${{ needs.build.outputs.version }}") {
            throw "This checkout bumps to $version, the build job built ${{ needs.build.outputs.version }}"
          }

      - name: Download unsigned payload
        uses: actions/download-artifact@v8
        with:
          name: kute-unsigned-payload-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: target/release

      - name: Sign the payload
        run: bun sign.js payload

      - name: Build installer
        run: bun run installer

      - name: Sign the installer
        run: bun sign.js installer

      - name: Build portable zip
        run: bun portable.js

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: kute-setup-x86_64-msi-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: target/kute-setup-x86_64.msi
          retention-days: 7

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: kute-x86_64-portable-zip-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: target/kute-x86_64-portable.zip
          retention-days: 7

      - name: Commit the version bump
        id: commit
        if: inputs.mode != 'build only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          if ("${{ needs.build.outputs.bump }}" -eq "none") {
            Add-Content $env:GITHUB_OUTPUT "oid=$head"
            exit 0
          }

          $files = "Cargo.toml", "Cargo.lock", "package.json", "resources/installer_script.wxs"

          git fetch --quiet origin master
          $remote = git rev-parse origin/master
          if ($remote -ne $head) {
            git diff --quiet $head $remote -- $files
            if ($LASTEXITCODE -ne 0) {
              throw "master moved during the build and changed the version files, run the workflow again"
            }
            Write-Host "master moved from $head to $remote during the build, the version files are unchanged there"
            $head = $remote
          }

          $additions = @($files | ForEach-Object {
            @{ path = $_; contents = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $_))) }
          })
          $body = @{
            query = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
            variables = @{
              input = @{
                branch = @{ repositoryNameWithOwner = $env:GITHUB_REPOSITORY; branchName = "master" }
                message = @{ headline = "bump version to ${{ needs.build.outputs.version }}" }
                expectedHeadOid = $head
                fileChanges = @{ additions = $additions }
              }
            }
          } | ConvertTo-Json -Depth 10

          $response = $body | gh api graphql --input -
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit the version bump: $response"
          }
          $oid = ($response | ConvertFrom-Json).data.createCommitOnBranch.commit.oid
          if (-not $oid) {
            throw "Could not commit the version bump: $response"
          }
          Add-Content $env:GITHUB_OUTPUT "oid=$oid"

      - name: Create GitHub Release
        id: release
        if: inputs.mode != 'build only'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.oid }}
          name: ${{ needs.build.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            target/kute-setup-x86_64.msi
            target/kute-x86_64-portable.zip

      - name: Check that the installer is the first asset
        if: inputs.mode != 'build only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $first = gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }}" --jq '.assets[0].name'
          if ($first -ne "kute-setup-x86_64.msi") {
            throw "The first release asset is $first, older clients would run it as the installer. Rename the other assets so they sort after kute-setup-x86_64.msi."
          }

  appimage:
    name: Build AppImage
    needs: release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit || 'master' }}
          lfs: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v ninja >/dev/null || ! command -v cmake >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ninja-build cmake
          fi
          cmake --version
          ninja --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AppImage
        run: bun run package:linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: kute-x86_64-appimage-${{ needs.release.outputs.version }}-${{ github.sha }}
          path: target/kute-x86_64.AppImage
          retention-days: 7

      - name: Add the AppImage to the draft release
        if: inputs.mode != 'build only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.version }}" target/kute-x86_64.AppImage --clobber

      - name: Check that the installer is still the first asset
        if: inputs.mode != 'build only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          first=$(gh release view "${{ needs.release.outputs.version }}" --json assets --jq '.assets | map(.name) | sort | .[0]')
          if [ "$first" != "kute-setup-x86_64.msi" ]; then
            echo "The first release asset is $first, older clients would run it as the installer."
            exit 1
          fi
